schema: metis17.pipeline/v1
release: metis-1.7-data-r1
planned_acquisition_budget_bytes: 200000000000000

# The full 200 TB launch requires explicit capacity confirmation. The user
# requested immediate work; this initial run cannot silently consume it all.
limits:
  capacity_confirmation: pending
  max_raw_bytes: 400000000000
  max_working_bytes: 2000000000000
  working_reservation_factor: 4
  policy_and_metadata_reserve_bytes: 20000000000
  filesystem_free_floor_bytes: 100000000000
  max_unknown_object_bytes: 32000000000

download:
  workers_per_host: 4
  attempts: 8
  timeout_seconds: 120
  admission_objects_per_group: 2
  poll_seconds: 10
  hosts:
    portage-login1: [huggingface.co]
    portage-login2: [data.hplt-project.org, data.commoncrawl.org, dumps.wikimedia.org]

prep:
  quality_profiles_path: configs/metis17/quality-profiles.yaml
  output_chunk_bytes: 128000000
  batch_size: 256
  workers_per_node: 32
  raw_readers_per_node: 2
  source_minimum_acceptance: 0.10
  network_content_fetch: false
  retain_raw: true

tokenizer:
  vocabulary_size: 131072
  split_digits: true
  token_dtype: uint32
  sample_target_bytes: 160000000000
  min_sample_bytes_per_category: 1000000000
  required_categories: [web, code, math, science, multilingual]
  special_tokens:
    - <|endoftext|>
    - <|padding|>
    - <|fim_prefix|>
    - <|fim_middle|>
    - <|fim_suffix|>
    - <|tool_call|>
    - <|tool_result|>

decontamination:
  minimum_matching_ngrams: 2
  minimum_short_matching_ngrams: 0
  minimum_code_matching_ngrams: 16
  minimum_code_skeleton_matching_ngrams: 0
  match_fraction: 0.002
  contiguous_run_minimum: 8

dedup:
  bucket_count: 64
  max_fan_in: 16
  highest_quality_wins: true
  discard_raw_or_losing_text: false
  global_cross_snapshot_english_near_delete: false

schedule:
  tst_source_tokens: 30000000000000
  tst_bag_size: 16
  ntp_source_tokens: 5000000000000

sources:
  - id: nemotron_cc_math
    kind: hf
    repo: nvidia/Nemotron-CC-Math-v1
    revision: 397a2502f2028c659ba411a6c4935b464a7f03aa
    prefixes: [4plus, 4plus_MIND, '3']
    allow_patterns: ['*.parquet']
    expected_inventory_bytes: 259937827291
    budget_bytes: 260000000000
    adapter: text
    priority: 100
    policy:
      category: math
      language: en
      license_mode: compilation
      collection_license: NVIDIA Open Data Agreement
      common_crawl_derived: true
      generated: false
      quality_profile: math
    path_policies:
      - name: 4plus
        patterns: ['4plus/*']
        priority: 100
        policy:
          metadata: {math_score: 4, source_quality_evidence: publisher_4plus_partition}
      - name: MIND
        patterns: ['4plus_MIND/*']
        priority: 98
        policy:
          generated: true
          metadata: {math_score: 4, source_quality_evidence: publisher_MIND_partition, generator_family: Phi-4}
      - name: score3
        patterns: ['3/*']
        priority: 90
        policy:
          metadata: {math_score: 3, source_quality_evidence: publisher_score3_partition}

  - id: nemotron_cc_code
    kind: hf
    repo: nvidia/Nemotron-CC-Code-v1
    revision: 5c5bebce9f9a85c237d63b2afad516ee532f950f
    prefixes: [data]

schema: metis.quality-profiles/v1
defaults:
  minimum_characters: 120
  maximum_characters: 40000000
  maximum_repeated_line_fraction: 0.65
  maximum_url_density_per_100_words: 20
  language: any
  reject_personal_data: true
  reject_secrets: true
  reject_benchmark_matches: true

# Publisher selection is recorded separately from these hygiene gates.
# These thresholds do not pretend to be a learned web-quality classifier.
profiles:
  curated_prose: {minimum_characters: 200, maximum_repeated_line_fraction: 0.50}
  native_prose: {minimum_characters: 120, maximum_repeated_line_fraction: 0.55}
  math: {minimum_characters: 80, maximum_repeated_line_fraction: 0.65}
  code: {minimum_characters: 40, maximum_repeated_line_fraction: 0.85}
  synthetic: {minimum_characters: 120, maximum_repeated_line_fraction: 0.65}
  science: {minimum_characters: 200, maximum_repeated_line_fraction: 0.60, personal_data_maximum_contacts: 4}
  raw_web: {minimum_characters: 200, maximum_repeated_line_fraction: 0.50}
  reference: {minimum_characters: 200, maximum_repeated_line_fraction: 0.65}

schema: metis.quality-profiles/v1
defaults:
  minimum_characters: 200
  maximum_characters: 2000000
  minimum_alpha_fraction: 0.45
  maximum_repeated_line_fraction: 0.20
  maximum_symbol_fraction: 0.35
  maximum_url_density_per_100_words: 4.0
  language: en
  language_probability_minimum: 0.80
  reject_personal_data: true
  reject_secrets: true
  reject_benchmark_matches: true

profiles:
  web_hq_v1: {minimum_characters: 400, minimum_alpha_fraction: 0.55, quality_score_minimum: 0.72}
  web_edu_v1: {minimum_characters: 500, minimum_alpha_fraction: 0.55, educational_score_minimum: 3.0}
  web_general_v1: {minimum_characters: 300, quality_score_minimum: 0.62}
  fresh_web_2026_v1: {minimum_characters: 500, quality_score_minimum: 0.76, require_capture_date: true, reject_probable_model_generated: true}
  web_diversity_v1: {minimum_characters: 240, quality_score_minimum: 0.55, preserve_informal_register: true}
  # `maximum_repeated_line_fraction` defaults to 0.20, which is a reasonable
  # signal for templated prose spam and a category error against source code.
  # Imports, closing braces, `end`, and `);` repeat by construction, so ordinary
  # files score far above it -- it was the top rejection for github_code_clean
  # (38B tokens) and nemotron_cc_code_v1 (31B). The failure mode this gate is
  # actually aimed at for code is machine-emitted output, which
  # `maximum_generated_file_probability` now measures directly, and copied
  # structure, which the code dedup pass removes with fingerprints.
  repository_code_v1: {minimum_characters: 80, maximum_repeated_line_fraction: 0.60, maximum_generated_file_probability: 0.10, require_license: true, secret_scan: required}
  fresh_repository_code_v1: {minimum_characters: 80, maximum_repeated_line_fraction: 0.60, require_recent_commit: true, require_active_repository: true, require_license: true, secret_scan: required}
  code_interleaved_v1: {minimum_characters: 300, maximum_repeated_line_fraction: 0.50, code_text_interleave_minimum: 0.15, quality_score_minimum: 0.70}
  engineering_discussion_v1: {minimum_characters: 120, require_technical_context: true, pii_scan: required}
  swe_interleave_v1: {minimum_components: 3, require_tests_or_examples: true, require_license: true}
  # For a corpus that ships a per-row verification result. Nothing we pin does
  # -- see the synthetic block below -- so these have no users today. They are
  # kept because they state the standard a future corpus could meet, and
  # because deleting them would hide that the standard exists.
  verified_synthetic_code_v1: {require_execution_or_static_verification: true, require_genealogy: true}
  verified_reasoning_v1: {require_programmatic_or_source_verification: true, require_genealogy: true}
  executable_code_v1: {require_execution_pass: true, require_license: true}
  # Worked mathematics repeats lines structurally -- aligned equation steps,
  # repeated `\\begin{align}`, restated expressions between manipulations. Same
  # reasoning as the code profiles above.
  math_4plus_v1: {minimum_characters: 200, maximum_repeated_line_fraction: 0.45, equation_integrity: required, math_score_minimum: 4}
  math_score3_v1: {minimum_characters: 300, maximum_repeated_line_fraction: 0.45, equation_integrity: required, math_score_minimum: 3, quality_score_minimum: 0.72}
  proof_v1: {minimum_characters: 250, maximum_repeated_line_fraction: 0.50, require_statement_and_argument: true}
  formal_proof_v1: {minimum_characters: 40, parser_or_compiler_check: required}
  # `repeated_header_footer_maximum` is now the only place pagination is judged;
  # the reading-order evidence no longer double-counts it. Measured over 200
  # FinePDFs-Edu records the fraction runs median 0.000, p75 0.111, p90 0.250,
  # max 0.667: the mass at zero is unpaginated extractions and the tail is
  # ordinary running heads. 0.35 keeps 95% of records while still catching a
  # document whose page edges are mostly boilerplate.
  # A technical PDF prints the author or office to contact about it, and
  # `personal_data` was its single largest rejection at 18 of 60. The allowance
  # admits a document carrying a contact block and still rejects one that lists
  # people in bulk -- a staff directory or a delegate roster -- which is the
  # object the gate is actually for.
  pdf_technical_v1: {minimum_characters: 800, ocr_confidence_minimum: 0.90, repeated_header_footer_maximum: 0.35, reading_order_check: required, personal_data_maximum_contacts: 4}
  # The fourth corpus to meet the same category error, after code, worked
  # mathematics and books. A LaTeX paper repeats lines by construction: aligned
  # equation environments restate `\\`, `&=` and `\end{align}`, and section
  # scaffolding recurs. Measured over arXiv records the fraction runs median
  # 0.1944, p90 0.3623, max 0.6675 -- the 0.20 default passed 51.1% of papers,
  # and 0.45 passes 97.2% while still catching a document that is mostly
  # repeated boilerplate. 0.45 is the allowance math_4plus_v1 already uses for
  # the same reason.
  scientific_paper_v1: {minimum_characters: 1000, maximum_repeated_line_fraction: 0.45, require_title_or_abstract: true, bibliography_body_ratio_maximum: 0.35}
  biomedical_paper_v1: {minimum_characters: 1000, require_open_access: true, bibliography_body_ratio_maximum: 0.35}
  # A book arrives as one record. The 2M-character default is sized for
  # documents, so a complete textbook -- OpenStax ships 5MB of text per book --
  # was discarded for being a book. The cap still exists to catch a pathological
  # blob; sequence-length chunking happens later, in packing.
  #
  # The repeated-line allowance is the same category error at book scale: a
  # textbook restates its running header, its section numbering, and its
  # per-page attribution footer on every one of a few thousand pages, so the
  # 0.20 default measures the format rather than the prose.
  textbook_v1: {minimum_characters: 800, maximum_characters: 40000000, maximum_repeated_line_fraction: 0.40, structural_completeness: required}
  fresh_science_v1: {minimum_characters: 800, require_publication_date: true, require_open_access: true}
  official_docs_v1: {minimum_characters: 200, require_canonical_source: true, require_version_metadata: true}
  engineering_report_v1: {minimum_characters: 800, structural_completeness: required}
  # Synthetic corpora ship the text and the generator. None of the released
  # ones ship a per-row grounding-document id or a per-row verification flag:
  # the publisher ran whatever checks it ran before release and recorded the
  # outcome in a dataset card, not in a column. Demanding those two fields
  # rejected every record of five sources -- roughly 58B tokens -- without
  # reading one of them.
  #
  # What a synthetic row can actually be judged on is its generator lineage,
  # which every Nemotron row carries in `models_used`, and the measured
  # condition of its text. Grounding is used wherever a corpus does ship it
  # (Cosmopedia's seed_data, Nemotron-CC-v2.1's warc_record_id) and is not
  # demanded of corpora that do not. `quality_score_minimum` is a text-hygiene
  # floor -- truncation, mojibake, degenerate repetition -- and is not a
  # substitute for verification; it does not claim to be one. The real controls
  # on unverified synthetic text are the pinned generator, the share of the mix
  # this category is allotted, and decontamination, all of which hold.
  grounded_synthetic_v1: {minimum_characters: 200, maximum_repeated_line_fraction: 0.45, require_genealogy: true, quality_score_minimum: 0.68}
  synthetic_qa_v1: {minimum_characters: 120, maximum_repeated_line_fraction: 0.45, require_genealogy: true, quality_score_minimum: 0.60}
  synthetic_reasoning_v1: {minimum_characters: 300, maximum_repeated_line_fraction: 0.45, require_genealogy: true, quality_score_minimum: 0.68}
  synthetic_code_v1: {minimum_characters: 120, maximum_repeated_line_fraction: 0.60, require_genealogy: true, secret_scan: required}
  # Cosmopedia does ship its seed document, so this one keeps the grounding
  # requirement it can actually satisfy.
  textbook_synthetic_v1: {require_source_document: true, require_genealogy: true, stylistic_diversity_check: required}
  reference_v1: {minimum_characters: 500, require_license: true}
  longform_book_v1: {minimum_characters: 2000, maximum_characters: 40000000, maximum_repeated_line_fraction: 0.35, chapter_integrity: required, require_license: true}
  # `answer_score_minimum` asked for a vote count that the Common Pile
  # StackExchange release does not carry -- its own filtering pass is what
  # selected these posts, and it kept the prose rather than the score. The
  # replacement measures the thing the score was a proxy for: that the record
  # actually contains a question and a substantive answer.
  explanatory_qa_v1: {minimum_characters: 250, require_license: true, require_question_and_answer: true}
  # Primary legal text publishes contact details as part of the record. A
  # Federal Register notice names the agency office to write to and prints its
  # telephone number, because that is what the notice is for. `reject_personal_data`
  # was written for scraped web pages, where a phone number is likely a private
  # individual's; here it discarded 38 of 60 sampled USGPO records over numbers
  # like (817) 222-5110 (FAA Fort Worth) and (843) 571-4366 (NOAA Southeast),
  # taking the source from 81.7% to 18.3%. Unlike an email, a phone number's
  # digits cannot say whether the line belongs to a desk or a person, so the
  # exemption is scoped to the one profile whose corpus is by definition an
  # official published government record.
  legal_primary_v1: {minimum_characters: 500, require_primary_source: true, require_jurisdiction: true, reject_personal_data: false}
  legal_synthetic_v1: {minimum_characters: 300, require_genealogy: true, quality_score_minimum: 0.68}
  translated_english_v1: {minimum_characters: 300, language_probability_minimum: 0.90, translation_quality_check: required}
  multilingual_native_v1: {minimum_characters: 300, language_probability_minimum: 0.90, allowed_language_registry: required}


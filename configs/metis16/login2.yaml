schema: metis.portage-profile/v1
name: login2
manifest: manifests/metis-1.6.yaml

operator:
  roles: [acquisition]
  # Portage exposes this service host as portage-login2 (and as its FQDN).
  # Retain the generic aliases for sites where hostname(1) strips the cluster
  # prefix, but explicitly accept the real Portage names as well.
  expected_host_patterns:
    ['login2', 'login2.*', 'portage-login2', 'portage-login2.*']

acquisition:
  mode: screen_foreground
  session_name: metis16-acquisition
  # login2 is an interactive/service host, so per-source concurrency stays
  # modest and every materializer is restartable. The outer width, though, was
  # set for a host we guessed at rather than the one we have: login2 reports
  # 384 cores at load 0.80, and the supervisor was one process using half of
  # one core. Downloads go through hf_hub_download a file at a time, so this
  # number *is* the number of concurrent transfers -- at 4 the host pulled
  # 126 MB/s, about 31 MB/s per stream, which is one HTTP stream's worth and
  # not a link limit. These threads block on network, not CPU, so 24 of them
  # still leaves the node effectively idle for its interactive users.
  #
  # Not in the execution contract: the contract hashes scheduler and gates, so
  # retuning this is resumable and costs no completed stage work.
  max_workers: 24
  maximum_task_attempts: 4
  retry_initial_seconds: 15
  retry_maximum_seconds: 60
  host_role: lustre_server
  # GitHub repository, discussion, and metadata-hydration builders share one
  # public-archive lane to keep transfer pressure bounded.
  # The repository index has its own lane. Its long opening phase groups tens
  # of millions of metadata rows with no network at all, and sharing the
  # single GitHub slot left the repository and discussion builders blocked
  # behind it for days. The two lanes together put at most two consumers on
  # public GitHub endpoints; move repository_index back to `github` if that
  # ever needs to be one.
  driver_lanes:
    common_crawl_ranges: common_crawl
    github_repositories: github
    # Discussions read the GitHub REST API; repositories pull ~1GiB codeload
    # archives. Sharing one lane meant the archive walk held the only slot for
    # days and the discussion builder never ran once -- while being one of the
    # donors meant to cover the archive walk's shortfall. Separate lanes still
    # put at most two consumers on public GitHub endpoints.
    github_discussions: github_discussions
    canonical_web: canonical
    canonical_git: canonical
    canonical_http: canonical
    derived_after_download: derived
  # Common Crawl is the only lane with work left, and every remaining source
  # uses it, so this cap alone decides whether they run in series or together.
  # Total concurrent range processes are lane width x common_crawl.range_workers
  # and total index-scan processes are lane width x index_scan_workers; size it
  # against the host's cores, not by feel. Retuning it is resumable -- it does
  # not reach the FreshWeb run fingerprint -- but that is only true because
  # range_workers no longer derives from it; see metis_data/download.py.
  lane_max_workers:
    github: 1
    github_discussions: 1
    common_crawl: ${METIS_CC_LANE_WORKERS:-1}
    canonical: 1
    derived: 1
  # The fresh-GitHub archive walk sustained ~3.7 archive fetches and ~0.3
  # accepted repositories per hour here: about a gigabyte per repository, and
  # roughly one in twelve carries an allowlisted root license. At that rate its
  # token target was unreachable, and the walk only ends when the target is met,
  # so leaving it unbounded blocked acquisition from completing. The source was
  # withdrawn from the 1.6 manifest for that reason, but keep the cap set: the
  # driver and its lane remain, and nothing here should be able to start an
  # unbounded walk again. -1 is unbounded.
  github_repository_maximum_archive_fetches: ${METIS_GITHUB_MAX_ARCHIVES:-25}
  # The cap above bounds codeload archives; this one bounds the GH Archive event
  # walk that feeds them, which is the half that was still unbounded. A monthly
  # partition otherwise reads ~720 hourly files, 70-140GiB, before it can
  # commit -- and no budget makes an empty partition legal, because a
  # materializer that accepts nothing fails closed. Both GitHub sources are
  # withdrawn from the 1.6 manifest, so like the cap above this is now a
  # dormant guardrail: it exists so no profile on this host can start an
  # open-ended transfer. One day per monthly partition. -1 is unbounded.
  github_maximum_hourly_archives: ${METIS_GITHUB_MAX_HOURLY_ARCHIVES:-24}
  common_crawl:
    range_workers: 4
    shard_count: 128
    keep_index_files: false
    # The URL-index scan is the throughput lever for Common Crawl acquisition:
    # each crawl publishes 300 Parquet partitions of roughly seven million rows,
    # and the per-row gates are pure Python. Each worker is a process that also
    # fetches its own partition, so this bounds concurrent index requests too.
    # Raise it toward the number of cores login2 can spare; 16 is the ceiling.
    #
    # Retuning this resumes an in-flight acquisition: throughput settings are
    # deliberately excluded from the run fingerprint. range_workers,
    # shard_count, keep_index_files, and final_opt_out_reserve_multiplier are
    # NOT — changing any of those starts a new run under a new fingerprint and
    # abandons every partition already scanned.
    index_scan_workers: ${METIS_CC_INDEX_SCAN_WORKERS:-8}
    # Optional node-local working copy of the acquisition ledger. SQLite is not
    # designed for network filesystems, and the WARC phase commits once per
    # fetched group. When set, the ledger is worked on local disk and published
    # back to Lustre every state_checkpoint_seconds; a crash rewinds to the last
    # checkpoint, never past it. Leave empty to keep the ledger on Lustre.
    state_scratch_root: ${METIS_CC_STATE_SCRATCH:-}
    state_checkpoint_seconds: 300
    # url_winners is keyed on the canonical URL and accumulates every
    # partition's winners -- nine figures of rows by the end of a full run,
    # inserted at random positions in one index. SQLite's 2MiB default cache
    # turns each insert into a Lustre page read. login2 has memory; use it.
    state_cache_mib: ${METIS_CC_STATE_CACHE_MIB:-1024}
    # Retryable shortfalls double the deterministic per-partition sample in
    # the same Screen run. Round 8 is the fail-closed upper bound.
    maximum_selection_round: 8
    # Materialize 5% beyond the locked minimum so publisher opt-outs added
    # during acquisition do not normally turn the final handoff recount into
    # an underfill. The handoff still checks the original locked target.
    final_opt_out_reserve_multiplier: 1.05
  repository_index_workers: 4
  # The Nemotron metadata resolves to hundreds of millions of rows keyed on
  # sha256(repo, commit), so both index tables are WITHOUT ROWID B-trees that
  # would be written at uniformly random positions. Once such a tree outgrows
  # the page cache every insert becomes a page read, and on Lustre a page read
  # is a network round trip -- which is what left the builder still grouping
  # rows after 60 hours without fetching a single repository.
  #
  # The grouping phase is therefore an external sort: rows are spooled to
  # bucket files keyed on the leading byte of the repo key (sequential writes),
  # then loaded bucket by bucket in ascending order, so every insert sorts
  # after the tree's current maximum and lands on the rightmost leaf. The page
  # cache below now only has to cover one bucket's working set, not the tree.
  repository_index_cache_mib: ${METIS_REPO_INDEX_CACHE_MIB:-2048}
  # Must be a power of two dividing 256: bucket order has to be key order.
  # More buckets means less memory per bucket load and more spool files.
  repository_index_sort_buckets: ${METIS_REPO_INDEX_SORT_BUCKETS:-128}
  # Rows held across all buckets before a spool part is written and closed. A
  # part is the unit of durability -- metadata units are recorded complete only
  # once their rows are inside a closed part -- so this also bounds how much
  # metadata a crash replays. Roughly 200 bytes of resident memory per row.
  repository_index_spool_rows: ${METIS_REPO_INDEX_SPOOL_ROWS:-8000000}
  # Strongly preferred if login2 exposes node-local disk: this workload is
  # nearly pure small random I/O, which is the case SQLite's own documentation
  # says not to put on a network filesystem. The working copy is published back
  # to Lustre between metadata units and after every committed output batch, so
  # a lost node rewinds to the last checkpoint, never past published output.
  repository_index_scratch_root: ${METIS_REPO_INDEX_SCRATCH:-}
  repository_index_checkpoint_seconds: 900

storage:
  # /lus/lustre1 itself is shared and is deliberately rejected. The account
  # owner must supply the confirmed user-owned child directory at launch.
  lustre_root: ${METIS_LUSTRE_ROOT:-auto}
  require_explicit_root: true
  allowed_root_prefixes: [/lus/lustre1/vollmerc]
  forbidden_roots: ['/', /lus, /lus/lustre1, /lus/lustre1/vollmerc]
  expected_filesystem: lustre
  quota_group: sumusa
  # Some Lustre sites report 0/0 even when a project/default quota applies.
  # Production acquisition must not interpret that as unlimited implicitly.
  require_explicit_quota_acknowledgement: true
  quota_unknown_acknowledgement: ${METIS_LUSTRE_QUOTA_ACKNOWLEDGEMENT:-}
  minimum_free_tb: 3
  minimum_free_inodes: 100000
  recommended_free_tb: 5
  safety_free_tb: 0.5
  raw_retention: until_normalized_successor_hash_verified
  intermediate_retention: delete_after_successor_hash_verified
  normalized_format: jsonl.zst
  final_token_dtype: uint16
  final_shard_tokens: 1000000000
  directories:
    cache: cache
    raw: raw
    normalized: normalized
    eligible: eligible
    dedup: dedup
    contamination: contamination
    tokenizer: tokenizer
    token_counts: token-counts
    selected: selected
    release: releases/metis-1.6-data-r1
    state: state/metis-1.6-data-r1
    logs: logs/metis-1.6-data-r1

# Download batching remains here for source-lock compatibility. No job from
# this profile is submitted to Slurm.
scheduler:
  mode: none
  download:
    target_bytes_per_task: 20000000000
    max_concurrent: 4
  minhash_priority:
    # Default is 256MiB. The duplicate-component union-find touches its node
    # table at random and is the one filter-chain structure large enough to
    # outgrow a small cache, which is precisely how the acquisition ledger
    # failed. Four filter tasks may run at once, so this is up to 64GiB of a
    # host that had 706GiB free and was using one.
    sqlite_cache_mb: ${METIS_MINHASH_CACHE_MIB:-16384}

runtime:
  python: /usr/bin/python3.11
  environment_dir: ${METIS_RUNTIME_DIR:-.metis-runtime-login2}
  require_apptainer_for_compute: false
  hf_home: cache/huggingface
  temp_dir: cache/tmp
  # Filter-chain scratch, which is where the MinHash union-find and span-dedup
  # SQLite databases live. They are WITHOUT ROWID B-trees written at random
  # positions -- the same access pattern that, left on Lustre with a small
  # cache, turned the Common Crawl ledger into a 663GB database that produced
  # 184KiB of documents in eleven days. temp_dir above resolves under the
  # Lustre root, so leaving this unset would repeat that exactly.
  #
  # login2 exposes no node-local disk: sda is unmounted, /home is NFS, and / is
  # an overlay. /tmp is a 378GiB tmpfs, so this scratch is RAM-backed and fast,
  # but it is also charged against the host's 755GiB. Watch `free -g` during
  # dedup; if a stage approaches the tmpfs limit, point this at a Lustre path
  # to trade speed for capacity rather than letting a stage die on ENOSPC.
  node_local_temp_dir: ${METIS_NODE_LOCAL_TMP:-/tmp}
  download_retries: 8
  request_timeout_seconds: 900
  # Every production driver in the manifest has a materialized, receipt-backed
  # implementation with an offline end-to-end fixture.
  dynamic_materializers_enabled: true

gates:
  fail_closed: true
  require_hf_auth_for_gated_sources: true
  require_github_auth: true
  require_contamination_index: true
  require_acquisition_handoff: true
  require_license_ledger: true
  license_review_complete: false
  require_clean_repository: true
  require_final_tokenizer_counts: true
  maximum_generated_share: 0.15
  minimum_unique_tokens: 950000000000

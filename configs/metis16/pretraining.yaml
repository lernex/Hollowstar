schema: metis.pretraining-contract/v1
model: metis-1.6
data_release: metis-1.6-data-r1
require_verified_release: true
token_dtype: uint16
tokenizer_vocabulary_size: 65536
sequence_length: 4096
total_train_tokens: 804755808835
token_counter: globally_emitted_non_padding_tokens
resume_state:
  require_global_token_cursor: true
  require_phase: true
  require_shard_order_seed: true
  require_shard_and_offset: true
phases:
  # These boundaries are the manifest's schedule, not the 1T plan. The corpus
  # measured 849.5B tokens against a 1T ask, so the schedule was refit to
  # 804.8B on 2026-08-15 and metis_training/data.py was moved with it. This
  # file is the third copy of the same numbers and was left behind, which would
  # have had training ask for phases the release does not contain.
  - id: phase_a
    start_token: 0
    end_token_exclusive: 554849376946
    data_directory: phase-a
    learning_rate_segment: warmup_then_broad_cosine
  - id: phase_b
    start_token: 554849376946
    end_token_exclusive: 764518018395
    data_directory: phase-b
    learning_rate_segment: capability_intensification
  - id: phase_c
    start_token: 764518018395
    end_token_exclusive: 804755808835
    data_directory: phase-c
    learning_rate_segment: final_decay_cooldown
ordering:
  cross_phase_shuffle: forbidden
  deterministic_shard_shuffle_within_phase: true
  seed: 16062026
  preserve_document_boundaries_in_index: true
  pack_across_documents: true
  insert_eos_between_documents: true
# The base model is NOT the 1T checkpoint.  It is complete only once continued
# pretraining has extended the context window to the deployed 131,072, so the
# released base weights contain both.  The two remain entirely separate inputs:
# `phases` above consume the 1T pretraining release, `continued_pretraining`
# below consumes its own sealed long-context corpus, and neither token counter,
# data directory, nor learning-rate segment is shared.  Nothing declared here is
# mixed into phase-a/b/c.
base_model_complete_after: [phase_c, continued_pretraining]

continued_pretraining:
  stage_id: context_extension
  # Contracted here because its output is the base model; executed by the
  # pipeline in configs/metis16/posttraining.yaml, which cross-checks against
  # this block and refuses to run if the two disagree.
  executed_by: metis.posttraining-pipeline/v1
  base_context: 4096
  train_context: 163840
  deploy_context: 131072
  schedule: single_jump
  positional_encoding: nope
  token_budget: 18000000000
  token_counter: globally_emitted_non_padding_tokens
  optimizer_state: preserve
  # Separate corpus, separate schema, separate acquisition. It is deliberately
  # not part of data_release: metis-1.6-data-r1.
  data_env: METIS_CONTEXT_EXTENSION_DATA
  data_schema: metis.context-extension-data/v1
  in_pretraining_release: false
  checkpoint_gates: [6000000000, 12000000000, 18000000000]
  gate_policy:
    checkpoint_at_first_optimizer_boundary_after_target: true
    maximum_gate_overshoot_tokens: 65000000
    retain_all_gate_checkpoints: true
    promote_best_passing_gate: true
  sequence_mix: {long: 0.90, base: 0.10}
  data_mix: {pretrain_style: 0.80, synthetic_long_context: 0.20}
  # There is no context or sequence parallelism, so one sequence per rank is the
  # floor and the global batch is world_size x 163,840 -- it cannot be reduced.
  # The 65,000,000-token overshoot allowance therefore caps the allocation at
  # 396 ranks; 384 is the largest expert-parallel-divisible world under it.
  # Wider allocations also collapse the step count: 352 ranks leaves Logos only
  # 312 optimizer steps for the whole phase against ~173,000 for the 1T phases.
  maximum_world_size: 384
  recommended_world_size: 64

optimizer_values:
  status: must_be_locked_after_portage_throughput_and_stability_probe
  note: This contract fixes data order and phase boundaries, not an unmeasured base learning rate or global batch.


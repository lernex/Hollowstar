schema: metis.posttraining-pipeline/v1
model: metis-1.6
families: [praxis, logos]
fail_closed: true

# Every data/teacher/verifier input below is a sealed manifest. The orchestrator
# refuses missing, partial, unpinned, tokenizer-incompatible, or hash-drifted
# inputs; it never fabricates a substitute dataset or silently drops a stage.
tokenizer:
  vocabulary_size: 65536
  manifest_env: METIS_TOKENIZER_MANIFEST
  reasoning_mode_tokens:
    direct: <|direct|>
    think: <|think|>
    think_max: <|think_max|>

research_basis:
  nanbeige4_1_3b:
    paper: https://arxiv.org/abs/2602.13367
    used_for: [code_correctness_then_efficiency, on_policy_filter, agentic_rl]
  nanbeige4_2_3b:
    paper: https://arxiv.org/abs/2607.22083
    used_for: [hybrid_mode_rl, think_length_control, agentic_rl]
  ax_k1:
    paper: https://arxiv.org/abs/2601.09200
    used_for: [same_prompt_mode_overlap, paired_mode_gspo, format_rewards]
  mopd:
    paper: https://arxiv.org/abs/2606.30406
    used_for: [parallel_capability_specialists, same_origin_teacher_consolidation]
  open_mopd:
    paper: https://arxiv.org/abs/2608.19098
    used_for: [domain_mode_token_share_auditing, consolidation_balance]
  nemotron_nano_2:
    paper: https://arxiv.org/abs/2508.14444
    used_for: [single_jump_context_extension, overshoot, mixed_short_context]
  nemotron_3:
    paper: https://arxiv.org/abs/2512.20856
    used_for: [nope_direct_context_extension]
  minicpm5_1b:
    source: https://github.com/OpenBMB/MiniCPM
    used_for: [deep_then_hybrid_sft, capability_rl_specialists, same_tokenizer_opd]
  ultradata_sft_2605:
    source: https://huggingface.co/datasets/openbmb/UltraData-SFT-2605
    used_for: [explicit_think_direct_splits, domain_mode_sft]

# Continued pretraining is contracted by the pretraining side because its
# output is the base model, not an aligned one.  This pipeline executes it and
# the loader refuses to start if the two declarations diverge.
continued_pretraining_contract: configs/metis16/pretraining.yaml
base_model_boundary: context_extension

context_extension:
  base_context: 4096
  deploy_context: 131072
  # A conservative 1.25x overshoot inside the 164k-200k plan range. The sealed
  # data manifest must prove this length is supported by the actual document
  # histogram; no staged 32k/64k ladder is permitted.
  train_context: 163840
  schedule: single_jump
  positional_encoding: nope
  token_budget: 18000000000
  checkpoint_gates: [6000000000, 12000000000, 18000000000]
  # Memory strategy. This is the one stage where Metis-1.6 does not fit: a
  # physical pass at 163,840 tokens keeps four mHC streams alive per layer, and
  # replaying the whole pass means every block's activations are live at once.
  # The figure is per rank, so data parallelism replicates the problem instead
  # of dividing it -- adding APUs does not help, and these two knobs do.
  #
  # Layer-level recompute replays one block at a time instead of one pass at a
  # time. Identical arithmetic (the same 8/6 replay factor the throughput model
  # already prices), roughly an L/3 reduction in live activations, and it alone
  # brings Praxis comfortably inside 128 GB of unified HBM3.
  #
  # Context parallelism shards the sequence four ways so each rank owns 40,960
  # contiguous tokens. Four is chosen to match the four APUs on a Cray EX255a
  # node: the group exchanges SSM state and gathered keys at every layer of
  # every pass, and that traffic must stay on Infinity Fabric rather than
  # crossing Slingshot. Logos needs it; Praxis inherits it for free because the
  # two families share a launcher.
  #
  # Attention pays a causal-imbalance tax under contiguous shards -- rank r
  # attends over roughly (r+1)/CP of the sequence, so the last rank sets the
  # pace at 2*CP/(CP+1) = 1.6x the mean. With 3 of 20 Logos layers attentional
  # that is a step-time penalty in the high teens, and it buys a Mamba state
  # exchange that is exact rather than truncated. Striping the attention layers
  # alone would recover it and is deliberately left for 1.7.
  memory_strategy:
    activation_recompute_policy: layer
    context_parallel_size: 4
    micro_batch: 1
    # Packing flattens [batch, sequence] into one row, which interleaves batch
    # rows across shards; the model refuses micro_batch > 1 under CP rather than
    # carry mixer state between rows. At 163,840 tokens one sequence already is
    # the micro-batch, so this costs nothing.
    require_micro_batch_one: true
    # Peak HBM must be measured on Portage before the run is trusted; the
    # analytic estimate is activation-only and omits optimizer state and kernel
    # workspace.
    verify_peak_hbm_on_first_gate: true
  sequence_mix:
    long: 0.90
    base: 0.10
  data_mix:
    pretrain_style: 0.80
    synthetic_long_context: 0.20

dynamic_thinking_length:
  enabled: true
  applies_to_mode: think
  excluded_modes: [direct, think_max]
  difficulty_signal: avg_at_16_pass_rate
  formula: two_sided_proximity_to_difficulty_budget
  lambda: 0.05
  deadband_fraction: 0.10
  wrong_response_shaping: 0
  truncated_response_policy: mask
  think_max_positive_length_reward: false
  note: Correctness-dominant efficiency shaping applies only to think; think_max receives a larger generation budget but no reward for verbosity.

reasoning_modes:
  names: [direct, think, think_max]
  response_contract:
    direct:
      visible_reasoning_trace: forbidden
      reasoning_length_shaping: none
    think:
      visible_reasoning_trace: required
      reasoning_length_shaping: difficulty_aware_efficiency
    think_max:
      visible_reasoning_trace: required
      reasoning_length_shaping: correctness_only_free_expansion
      positive_length_reward: false
  data_contract:
    immutable_raw_sources: true
    explicit_mode_label_required: true
    same_prompt_mode_overlap_required: true
    prompt_share_audited: true
    target_token_share_audited: true
    unknown_mode_quarantined: true
  more_invariance:
    mode_conditioned_depth_or_k: false
    target_mean_depth_per_mode:
      direct: 2.0
      think: 2.0
      think_max: 2.0
    target_mean_routed_k_per_mode:
      direct: 4.0
      think: 4.0
      think_max: 4.0

stages:
  - id: context_extension
    input_stage: base_pretraining
    enabled: true
    output_kind: checkpoint
    optimizer_state: preserve
    sequence_length: 163840
    deploy_context: 131072
    token_budget: 18000000000
    checkpoint_gates: [6000000000, 12000000000, 18000000000]
    gate_policy:
      checkpoint_at_first_optimizer_boundary_after_target: true
      maximum_gate_overshoot_tokens: 65000000
      retain_all_gate_checkpoints: true
      promote_best_passing_gate: true
      fail_on_nonfinite: true
    optimizer:
      schedule: warmup_then_cosine
      warmup_fraction: 0.01
      final_lr_ratio: 0.10
      preserve_optimizer_moments: true
    objective:
      name: causal_language_modeling
      document_boundaries: true
      mamba_state_reset_at_document_boundary: true
      attention_document_mask: true
    requirements:
      - name: context_extension_data
        env: METIS_CONTEXT_EXTENSION_DATA
        schema: metis.context-extension-data/v1
        tokenizer_bound: true
        minimum_tokens: 18000000000
        maximum_tokens: 18000000000
        required_metadata:
          base_context: 4096
          train_context: 163840
          deploy_context: 131072
          single_jump: true
          long_sequence_fraction: 0.90
          base_sequence_fraction: 0.10
          pretrain_style_fraction: 0.80
          synthetic_long_context_fraction: 0.20
          document_length_histogram_verified: true
          checkpoint_gates: [6000000000, 12000000000, 18000000000]
          compact_layout: metis.compact-causal/v1

  - id: cold_start_sft
    input_stage: context_extension
    enabled: true
    output_kind: checkpoint
    optimizer_state: reset
    sequence_length: 65536
    length_mix:
      8192_to_32768: 0.92
      32769_to_65536: 0.08
    domain_mix:
      math: 0.50
      science: 0.30
      code: 0.20
    answer_modes:
      direct: 0.15
      think: 0.60
      think_max: 0.25
    required_audits: [identity_scrub, safety_calibration, abstention, deduplication, contamination, answer_mode_balance]
    objective:
      name: response_only_cross_entropy
      mask_prompt_tokens: true
      keep_think: true
    requirements:
      - name: cold_start_sft_data
        env: METIS_COLD_START_SFT_DATA
        schema: metis.sft-data/v2
        tokenizer_bound: true
        # Nanbeige reports 30M source QA instructions, not 30M fully padded
        # 32K tensors. Seal that source count separately from the number of
        # document-isolated packed training sequences.
        minimum_source_instructions: 30000000
        required_metadata:
          sequence_length: 65536
          length_bucket_mass:
            8192_to_32768: 0.92
            32769_to_65536: 0.08
          packed_sequences: true
          reasoning_modes: [direct, think, think_max]
          explicit_mode_labels_present: true
          same_prompt_mode_overlap_validated: true
          prompt_share_by_mode_audited: true
          target_token_share_by_mode_audited: true
          keep_think: true
          identity_scrub_passed: true
          safety_calibration_passed: true
          abstention_passed: true
          deduplication_passed: true
          contamination_passed: true

  - id: overall_sft
    input_stage: cold_start_sft
    enabled: true
    output_kind: checkpoint
    optimizer_state: preserve
    sequence_length: 131072
    length_mix:
      8192_to_32768: 0.65
      32769_to_65536: 0.25
      65537_to_131072: 0.10
    domain_mix:
      reasoning: 0.40
      general_qa_writing: 0.30
      agent_tool_use: 0.20
      code: 0.10
    answer_modes:
      direct: 0.45
      think: 0.40
      think_max: 0.15
    required_audits: [identity_scrub, safety_calibration, abstention, deduplication, contamination, answer_mode_balance]
    objective:
      name: response_only_cross_entropy
      mask_prompt_tokens: true
      keep_think: true
      function_call_schema_loss: true
    requirements:
      - name: overall_sft_data
        env: METIS_OVERALL_SFT_DATA
        schema: metis.sft-data/v2
        tokenizer_bound: true
        required_metadata:
          sequence_length: 131072
          length_bucket_mass:
            8192_to_32768: 0.65
            32769_to_65536: 0.25
            65537_to_131072: 0.10
          reasoning_modes: [direct, think, think_max]
          explicit_mode_labels_present: true
          same_prompt_mode_overlap_validated: true
          prompt_share_by_mode_audited: true
          target_token_share_by_mode_audited: true
          keep_think: true
          function_call_schema_validated: true
          solution_refinement_provenance_complete: true
          cot_reconstruction_provenance_complete: true
          identity_scrub_passed: true
          safety_calibration_passed: true
          abstention_passed: true
          deduplication_passed: true
          contamination_passed: true
      - name: sft_teacher_pool
        env: METIS_SFT_TEACHER_POOL
        schema: metis.teacher-pool/v1
        tokenizer_bound: false
        required_metadata:
          revisions_pinned: true
          licenses_approved: true
          evaluation_checklists_versioned: true

  # SFT establishes the three output modes. This short shared on-policy pass
  # makes switching, trace format, repetition, and termination stable before
  # the capability branches diverge. External models may contribute verified
  # text to SFT, but no cross-tokenizer logit or preference distillation occurs.
  - id: hybrid_mode_gspo
    input_stage: overall_sft
    enabled: true
    output_kind: checkpoint
    optimizer_state: reset
    sequence_length: 65536
    domain: general_behavior
    preserves_unified_policy: true
    mode_policy:
      modes: [direct, think, think_max]
      interleaved_mode_conditioning: true
      same_prompt_mode_overlap_required: true
      target_token_share_balancing: true
      direct_trace_leakage_forbidden: true
      think_max_positive_length_reward: false
    on_policy_filter:
      samples_per_prompt: 16
      strict_min_pass_rate: 0.10
      strict_max_pass_rate: 0.90
      generated_by_stage: overall_sft
    objective:
      algorithm: gspo
      ratio_unit: sequence
      length_normalized_ratio: true
      clip_low: 0.0003
      clip_high: 0.0004
      kl_penalty: 0
      mask_truncated: true
      dynamic_thinking_length: true
      length_schedule:
        correctness_only_fraction: 0.60
        adaptive_budget_fraction: 0.40
    autotune:
      clip_pairs: [[0.0002, 0.0003], [0.0003, 0.0004], [0.0004, 0.0005]]
      length_coefficients: [0.0, 0.02, 0.05]
      gate:
        name: stable_reward_and_entropy_with_no_eval_regression
        minimum_reward_gain: 0.0
        maximum_entropy_delta: 0.25
        maximum_evaluation_regression: 0.0
        maximum_nonfinite_steps: 0
      live_canary:
        schema: metis.posttraining-live-canary-policy/v1
        training_optimizer_steps: 2
        evaluator_implementation: metis.rlvr-offline-policy-replay/v1
        minimum_evaluation_records: 128
        maximum_reproduction_tolerance: 0.001
        restore_parent_between_trials: true
        restore_rng_between_trials: true
        require_working_set_autotune: true
        maximum_working_set_candidates: 8
        working_set_warmup_trials: 1
        working_set_measurement_trials: 3
    reward:
      correctness: verifier_or_calibrated_pairwise_judge
      mode_compliance: strict_control_and_trace_format
      mode_compliance_weight: 1.0
      standalone_scalar_reward_model: false
      length_coefficient: 0.02
    requirements:
      - name: hybrid_mode_rl_data
        env: METIS_HYBRID_MODE_RL_DATA
        schema: metis.rlvr-data/v2
        tokenizer_bound: true
        family_bound: true
        checkpoint_bound: true
        generated_from_stage: overall_sft
        required_metadata:
          domain: general_behavior
          avg_at_k: 16
          strict_filter_min: 0.10
          strict_filter_max: 0.90
          all_samples_in_band: true
          reasoning_modes: [direct, think, think_max]
          explicit_mode_labels_present: true
          same_prompt_mode_overlap_validated: true
          target_token_share_by_mode_audited: true
          mode_compliance_scores_present: true
      - name: hybrid_mode_verifier
        env: METIS_HYBRID_MODE_VERIFIER
        schema: metis.verifier-bundle/v1
        tokenizer_bound: false
        required_metadata:
          domain: general_behavior
          deterministic_format_checks: true
          calibrated_pairwise_judge: true
          judge_revision_pinned: true
          calibration_set_pinned: true
          adversarially_validated: true
          generation_adapter_present: true

  - id: specialist_reasoning
    input_stage: hybrid_mode_gspo
    branch_from: hybrid_mode_gspo
    preserves_unified_policy: true
    enabled: true
    output_kind: checkpoint
    optimizer_state: reset
    domain: stem
    sequence_length: 65536
    mode_policy:
      modes: [direct, think, think_max]
      prompt_mix: {direct: 0.15, think: 0.50, think_max: 0.35}
      same_prompt_mode_overlap_required: true
      target_token_share_balancing: true
      think_max_positive_length_reward: false
    on_policy_filter:
      samples_per_prompt: 16
      strict_min_pass_rate: 0.10
      strict_max_pass_rate: 0.90
      generated_by_stage: hybrid_mode_gspo
    objective:
      algorithm: gspo
      ratio_unit: sequence
      length_normalized_ratio: true
      clip_low: 0.0003
      clip_high: 0.0004
      kl_penalty: 0
      mask_truncated: true
      dynamic_thinking_length: true
      length_schedule:
        correctness_only_fraction: 0.60
        adaptive_budget_fraction: 0.40
    autotune:
      clip_pairs: [[0.0002, 0.0003], [0.0003, 0.0004], [0.0004, 0.0005]]
      length_coefficients: [0.0, 0.02, 0.05]
      gate:
        name: stable_reward_and_entropy_with_no_eval_regression
        minimum_reward_gain: 0.0
        maximum_entropy_delta: 0.25
        maximum_evaluation_regression: 0.0
        maximum_nonfinite_steps: 0
      live_canary:
        schema: metis.posttraining-live-canary-policy/v1
        training_optimizer_steps: 2
        evaluator_implementation: metis.rlvr-offline-policy-replay/v1
        minimum_evaluation_records: 128
        maximum_reproduction_tolerance: 0.001
        restore_parent_between_trials: true
        restore_rng_between_trials: true
        require_working_set_autotune: true
        maximum_working_set_candidates: 8
        working_set_warmup_trials: 1
        working_set_measurement_trials: 3
    reward:
      correctness: binary_verifier
      verifier: python_symbolic_numeric_equivalence
      mode_compliance: strict_control_and_trace_format
      mode_compliance_weight: 1.0
      standalone_scalar_reward_model: false
      length_coefficient: 0.05
    requirements:
      - name: stem_rlvr_data
        env: METIS_STEM_RLVR_DATA
        schema: metis.rlvr-data/v2
        tokenizer_bound: true
        family_bound: true
        checkpoint_bound: true
        generated_from_stage: hybrid_mode_gspo
        required_metadata:
          domain: stem
          avg_at_k: 16
          strict_filter_min: 0.10
          strict_filter_max: 0.90
          all_samples_in_band: true
          reasoning_modes: [direct, think, think_max]
          explicit_mode_labels_present: true
          same_prompt_mode_overlap_validated: true
          target_token_share_by_mode_audited: true
          mode_compliance_scores_present: true
      - name: stem_verifier
        env: METIS_STEM_VERIFIER
        schema: metis.verifier-bundle/v1
        tokenizer_bound: false
        required_metadata:
          domain: stem
          deterministic: true
          sandboxed: true
          adversarially_validated: true
          generation_adapter_present: true

  - id: specialist_code
    input_stage: hybrid_mode_gspo
    branch_from: hybrid_mode_gspo
    preserves_unified_policy: true
    enabled: true
    output_kind: checkpoint
    optimizer_state: reset
    domain: code
    sequence_length: 65536
    mode_policy:
      modes: [direct, think, think_max]
      prompt_mix: {direct: 0.25, think: 0.45, think_max: 0.30}
      same_prompt_mode_overlap_required: true
      target_token_share_balancing: true
      think_max_positive_length_reward: false
    on_policy_filter:
      samples_per_prompt: 16
      strict_min_pass_rate: 0.10
      strict_max_pass_rate: 0.90
      generated_by_stage: hybrid_mode_gspo
    objective:
      algorithm: gspo
      ratio_unit: sequence
      length_normalized_ratio: true
      clip_low: 0.0003
      clip_high: 0.0004
      kl_penalty: 0
      mask_truncated: true
      dynamic_thinking_length: true
      length_schedule:
        correctness_only_fraction: 0.60
        adaptive_budget_fraction: 0.40
    autotune:
      clip_pairs: [[0.0002, 0.0003], [0.0003, 0.0004], [0.0004, 0.0005]]
      length_coefficients: [0.0, 0.02, 0.05]
      gate:
        name: stable_reward_and_entropy_with_no_eval_regression
        minimum_reward_gain: 0.0
        maximum_entropy_delta: 0.25
        maximum_evaluation_regression: 0.0
        maximum_nonfinite_steps: 0
      live_canary:
        schema: metis.posttraining-live-canary-policy/v1
        training_optimizer_steps: 2
        evaluator_implementation: metis.rlvr-offline-policy-replay/v1
        minimum_evaluation_records: 128
        maximum_reproduction_tolerance: 0.001
        restore_parent_between_trials: true
        restore_rng_between_trials: true
        require_working_set_autotune: true
        maximum_working_set_candidates: 8
        working_set_warmup_trials: 1
        working_set_measurement_trials: 3
    reward:
      correctness: sandbox_test_pass_fraction
      efficiency_reward: gated_on_full_correctness
      mode_compliance: strict_control_and_trace_format
      mode_compliance_weight: 1.0
      standalone_scalar_reward_model: false
      length_coefficient: 0.05
    requirements:
      - name: code_rlvr_data
        env: METIS_CODE_RLVR_DATA
        schema: metis.rlvr-data/v2
        tokenizer_bound: true
        family_bound: true
        checkpoint_bound: true
        generated_from_stage: hybrid_mode_gspo
        required_metadata:
          domain: code
          avg_at_k: 16
          strict_filter_min: 0.10
          strict_filter_max: 0.90
          all_samples_in_band: true
          private_tests_present: true
          reasoning_modes: [direct, think, think_max]
          explicit_mode_labels_present: true
          same_prompt_mode_overlap_validated: true
          target_token_share_by_mode_audited: true
          mode_compliance_scores_present: true
      - name: code_verifier
        env: METIS_CODE_VERIFIER
        schema: metis.verifier-bundle/v1
        tokenizer_bound: false
        required_metadata:
          domain: code
          deterministic: true
          sandboxed: true
          network_disabled: true
          resource_limits_enforced: true
          adversarially_validated: true
          generation_adapter_present: true

  - id: specialist_knowledge
    input_stage: hybrid_mode_gspo
    branch_from: hybrid_mode_gspo
    preserves_unified_policy: true
    enabled: true
    output_kind: checkpoint
    optimizer_state: reset
    domain: knowledge
    sequence_length: 65536
    mode_policy:
      modes: [direct, think, think_max]
      prompt_mix: {direct: 0.60, think: 0.30, think_max: 0.10}
      same_prompt_mode_overlap_required: true
      target_token_share_balancing: true
      think_max_positive_length_reward: false
    on_policy_filter:
      samples_per_prompt: 16
      strict_min_pass_rate: 0.10
      strict_max_pass_rate: 0.90
      generated_by_stage: hybrid_mode_gspo
    objective:
      algorithm: gspo
      ratio_unit: sequence
      length_normalized_ratio: true
      clip_low: 0.0003
      clip_high: 0.0004
      kl_penalty: 0
      mask_truncated: true
      dynamic_thinking_length: true
      length_schedule:
        correctness_only_fraction: 0.60
        adaptive_budget_fraction: 0.40
    autotune:
      clip_pairs: [[0.0002, 0.0003], [0.0003, 0.0004], [0.0004, 0.0005]]
      length_coefficients: [0.0, 0.02, 0.05]
      gate:
        name: stable_reward_and_entropy_with_no_eval_regression
        minimum_reward_gain: 0.0
        maximum_entropy_delta: 0.25
        maximum_evaluation_regression: 0.0
        maximum_nonfinite_steps: 0
      live_canary:
        schema: metis.posttraining-live-canary-policy/v1
        training_optimizer_steps: 2
        evaluator_implementation: metis.rlvr-offline-policy-replay/v1
        minimum_evaluation_records: 128
        maximum_reproduction_tolerance: 0.001
        restore_parent_between_trials: true
        restore_rng_between_trials: true
        require_working_set_autotune: true
        maximum_working_set_candidates: 8
        working_set_warmup_trials: 1
        working_set_measurement_trials: 3
    reward:
      correctness: normalized_closed_book_alias_match
      hallucination_penalty: source_checked_claims
      mode_compliance: strict_control_and_trace_format
      mode_compliance_weight: 1.0
      standalone_scalar_reward_model: false
      length_coefficient: 0.02
    requirements:
      - name: knowledge_rl_data
        env: METIS_KNOWLEDGE_RL_DATA
        schema: metis.rlvr-data/v2
        tokenizer_bound: true
        family_bound: true
        checkpoint_bound: true
        generated_from_stage: hybrid_mode_gspo
        required_metadata:
          domain: knowledge
          avg_at_k: 16
          strict_filter_min: 0.10
          strict_filter_max: 0.90
          all_samples_in_band: true
          aliases_source_checked: true
          reasoning_modes: [direct, think, think_max]
          explicit_mode_labels_present: true
          same_prompt_mode_overlap_validated: true
          target_token_share_by_mode_audited: true
          mode_compliance_scores_present: true
      - name: knowledge_verifier

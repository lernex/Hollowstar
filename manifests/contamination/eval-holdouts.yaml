schema: metis.contamination-registry/v2
policy:
  fail_closed_if_unavailable: true
  expected_benchmark_registries: 63
  expected_family_labels: 36
  expected_jobs: 203
  exact_match: true
  normalized_match: true
  ngram_size: 13
  minimum_matching_ngrams: 2
  short_ngram_size: 8
  minimum_short_matching_ngrams: 2
  code_ngram_size: 12
  minimum_code_matching_ngrams: 2
  code_skeleton_ngram_size: 16
  minimum_code_skeleton_matching_ngrams: 2
  maximum_shingle_rows: 32
  explicit_genealogy_match: true
  remove_entire_document: true
  quarantine_outputs: true
  semantic_dedup: false

# Every revision is immutable. All material below is evaluation-only and is
# prohibited from the pretraining mixture. Multi-config entries expand into
# independent pinned jobs and fail closed if any configured job is unavailable.

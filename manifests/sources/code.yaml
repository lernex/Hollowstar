sources:
  # Repository code is taken from corpora that ship the code itself.
  #
  # The three sources this replaces -- nvidia/Nemotron-Pretraining-Code v1-v3,
  # HuggingFaceTB/stack-edu, and bigcode/the-stack-v2 -- all publish indexes
  # rather than content: (repo, commit, path) triples, or Software Heritage
  # blob ids. Their Parquet carries no text column at all, so they normalize to
  # zero documents, and reconstructing them means fetching one archive per
  # repository. Measured on this corpus that is ~145M repositories at 56/min
  # through an inspected egress path, with a per-record license gate that
  # rejected 12,630 of the first 12,630 because ordinary GitHub repositories
  # carry no root license file. The arithmetic is months, and the builder only
  # terminates when its candidate target is met, so it blocked acquisition from
  # ever completing. See docs/metis16_operator_runbook.md.
  #
  # StarCoderData is The Stack v1 (which does ship content) after BigCode's
  # near-dedup, PII redaction, and permissive-license filtering -- so the
  # per-record license question is already settled upstream rather than being
  # rediscovered one archive at a time.
  - id: starcoder_permissive_code
    label: StarCoderData permissive repository code across 88 languages
    category: code
    phase_tokens: {phase_a: 35910000000, phase_b: 20928000000, phase_c: 5982000000}
    provenance: {generated: false, transformed: false, fresh: false}
    access:
      type: huggingface
      repo_id: bigcode/starcoderdata
      revision: 9fc30b578cedaec69e47302df72cf00feed7c8c4
      gated: auto
      # Language subtrees only. The repository also publishes
      # github-issues-filtered-structured, git-commits-cleaned, and two jupyter
      # subsets; issues would double-count metis_freshengineering_discussions
      # and commit diffs are not source files, so all four are excluded by
      # naming what is wanted rather than by a wildcard.
      allow_patterns: [
        ada/*.parquet, agda/*.parquet, alloy/*.parquet, antlr/*.parquet,
        applescript/*.parquet, assembly/*.parquet, augeas/*.parquet, awk/*.parquet,
        batchfile/*.parquet, bluespec/*.parquet, c/*.parquet, c-sharp/*.parquet,
        clojure/*.parquet, cmake/*.parquet, coffeescript/*.parquet,
        common-lisp/*.parquet, cpp/*.parquet, css/*.parquet, cuda/*.parquet,
        dart/*.parquet, dockerfile/*.parquet, elixir/*.parquet, elm/*.parquet,
        emacs-lisp/*.parquet, erlang/*.parquet, f-sharp/*.parquet,
        fortran/*.parquet, glsl/*.parquet, go/*.parquet, groovy/*.parquet,
        haskell/*.parquet, html/*.parquet, idris/*.parquet, isabelle/*.parquet,
        java/*.parquet, java-server-pages/*.parquet, javascript/*.parquet,
        json/*.parquet, julia/*.parquet, kotlin/*.parquet, lean/*.parquet,
        literate-agda/*.parquet, literate-coffeescript/*.parquet,
        literate-haskell/*.parquet, lua/*.parquet, makefile/*.parquet,
        maple/*.parquet, markdown/*.parquet, mathematica/*.parquet,
        matlab/*.parquet, ocaml/*.parquet, pascal/*.parquet, perl/*.parquet,
        php/*.parquet, powershell/*.parquet, prolog/*.parquet,
        protocol-buffer/*.parquet, python/*.parquet, r/*.parquet,
        racket/*.parquet, restructuredtext/*.parquet, rmarkdown/*.parquet,
        ruby/*.parquet, rust/*.parquet, sas/*.parquet, scala/*.parquet,
        scheme/*.parquet, shell/*.parquet, smalltalk/*.parquet,
        solidity/*.parquet, sparql/*.parquet, sql/*.parquet, stan/*.parquet,
        standard-ml/*.parquet, stata/*.parquet, systemverilog/*.parquet,
        tcl/*.parquet, tcsh/*.parquet, tex/*.parquet, thrift/*.parquet,
        typescript/*.parquet, verilog/*.parquet, vhdl/*.parquet,
        visual-basic/*.parquet, xslt/*.parquet, yacc/*.parquet, yaml/*.parquet,
        zig/*.parquet]
    license: {status: per_record_required, expression: repository-license}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 2.00, compressed_bytes_per_token: 0.65}
    processing: {quality_profile: repository_code_v1, dedup_namespace: global_code, priority: 90}

  - id: github_code_clean
    label: CodeParrot cleaned GitHub source files
    category: code
    phase_tokens: {phase_a: 15000000000, phase_b: 9000000000, phase_c: 2000000000}
    provenance: {generated: false, transformed: false, fresh: false}
    access:
      type: huggingface
      repo_id: codeparrot/github-code-clean
      revision: c48d40f9e70f0196f8236901ee35807f7d6c44c0
      gated: false
      allow_patterns: [data/*.parquet]
    license: {status: per_record_required, expression: repository-license}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 2.00, compressed_bytes_per_token: 0.62}
    processing: {quality_profile: repository_code_v1, dedup_namespace: global_code, priority: 78}

  - id: nemotron_cc_code_v1
    label: Nemotron-CC-Code tutorials, docs, snippets, and code-text interleaving
    category: code
    phase_tokens: {phase_a: 18000000000, phase_b: 10000000000, phase_c: 3000000000}
    provenance: {generated: false, transformed: false, fresh: false}
    access:
      type: huggingface
      repo_id: nvidia/Nemotron-CC-Code-v1
      revision: 5c5bebce9f9a85c237d63b2afad516ee532f950f
      gated: manual
      allow_patterns: [data/**]
    license: {status: requires_acceptance, expression: NVIDIA-Data-Agreement-for-Model-Training}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 2.30, compressed_bytes_per_token: 0.75}
    processing: {quality_profile: code_interleaved_v1, dedup_namespace: global_code_web, priority: 95}

  # metis_freshgithub_2025_26 (18B: 10/6/2) held the largest share of the 35B
  # software freshness bucket and was withdrawn for the 1.6 generation. Its
  # driver walks GH Archive for active repositories and then pulls a ~1GiB
  # codeload archive per candidate, of which roughly one in twelve carries an
  # allowlisted root license. On the acquisition host that sustained about 3.7
  # archive fetches and 0.3 accepted repositories per hour -- a 10B-token
  # phase_a target measured in years, and the walk only ends when the target is
  # met. Its tokens moved to metis_freshsoftwaredocs_2025_26 below, which is
  # Common Crawl-shaped, already producing, and a better match for the actual
  # goal: current framework documentation demonstrates present-day idiom more
  # reliably than a random sample of repositories that happen to have a recent
  # commit. Restoring fresh repository code needs a host with cheaper egress or
  # a pointer-free source of recent permissively licensed repositories.
  #
  # metis_freshengineering_discussions_2025_26 (7B: 3/3/1) was withdrawn with
  # it, and not by choice: its driver accepts a GH Archive event only if the
  # event's repository already carries a reviewed license and canonical-identity
  # proof in the repository slice, and the repository walk above is the only
  # writer of that slice. Without it the slice does not grow, the driver accepts
  # nothing, and a materializer that produces no records fails closed rather
  # than reporting a shortfall -- so keeping the source would not have yielded a
  # covered shortfall, it would have failed every partition and blocked the
  # handoff. Decoupling it means giving discussions its own per-repository
  # license and identity evidence over the GitHub REST API, which is a
  # generation-1.7 change, not a fix to make here.
  #
  # Both withdrawals move to metis_freshsoftwaredocs_2025_26 below, so the
  # software bucket stays at 35B, the code category stays at 160B, and every
  # per-phase total is unchanged. The software bucket now has the same shape as
  # the other three freshness buckets: one Common Crawl route, covered by cold
  # reserve rather than by an in-bucket donor. Both drivers and their lanes
  # remain wired; only the two sources are withdrawn.

  - id: metis_freshsoftwaredocs_2025_26
    label: Current official software docs, examples, migrations, and package APIs
    category: code
    phase_tokens: {phase_a: 19000000000, phase_b: 12000000000, phase_c: 4000000000}
    provenance: {generated: false, transformed: false, fresh: true, freshness_bucket: software}
    access:
      type: common_crawl
      crawls: [CC-MAIN-2026-08, CC-MAIN-2026-12, CC-MAIN-2026-17, CC-MAIN-2026-21, CC-MAIN-2026-25]
      reserve_crawls: [CC-MAIN-2026-04]
      url_index: s3://commoncrawl/cc-index/table/cc-main/warc/
      warc_root: https://data.commoncrawl.org/
      route: software_docs
      cutoff_start: '2025-01-01'
      cutoff_end: '2026-06-30'
    license: {status: per_record_required, expression: canonical-source-license}
    acquisition: {driver: common_crawl_ranges, candidate_multiplier: 1.80, compressed_bytes_per_token: 0.90}
    processing: {quality_profile: official_docs_v1, dedup_namespace: global_docs, priority: 100}

  - id: metis_systems_formal
    label: CUDA, Triton, SQL, shell, build systems, Lean, and Coq
    category: code
    phase_tokens: {phase_a: 90000000, phase_b: 72000000, phase_c: 18000000}
    provenance: {generated: false, transformed: false, fresh: false}
    access: {type: canonical_registry, registry: manifests/registries/systems_formal.yaml, selector: systems_code}
    license: {status: per_record_required, expression: canonical-source-license}
    acquisition: {driver: canonical_git, candidate_multiplier: 1.00, compressed_bytes_per_token: 0.72}
    processing: {quality_profile: repository_code_v1, dedup_namespace: global_code, priority: 94}

  - id: verified_synthetic_code
    label: NVIDIA verified synthetic code review, repair, rewrite, QA, and transpilation
    category: code
    phase_tokens: {phase_a: 2000000000, phase_b: 3000000000, phase_c: 0}
    provenance: {generated: true, transformed: true, fresh: false}
    access:
      type: huggingface
      repo_id: nvidia/Nemotron-Pretraining-Code-v2
      revision: 7b1a453d43e3c0df9749834b04f1a9510c0f5e5b
      gated: manual
      allow_patterns: [Synthetic-Code/**]
    license: {status: requires_acceptance, expression: NVIDIA-Data-Agreement-for-Model-Training}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 1.40, compressed_bytes_per_token: 0.75}
    processing: {quality_profile: verified_synthetic_code_v1, dedup_namespace: synthetic_code, priority: 85}

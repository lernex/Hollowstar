  - id: nemotron_specialized_reasoning_scicode
    label: Nemotron specialized logic, algorithms, STEM reasoning, and scientific code
    category: synthetic
    phase_tokens: {phase_a: 4000000000, phase_b: 8000000000, phase_c: 0}
    provenance: {generated: true, transformed: true, fresh: false}
    access:
      type: huggingface
      repo_id: nvidia/Nemotron-Pretraining-Specialized-v1
      revision: 9ed3718b5f2ae29074c5e34e64115432b7c4320f
      gated: false
      allow_patterns: [Nemotron-Pretraining-InfiniByte-Reasoning/**, Nemotron-Pretraining-Scientific-Coding/**]
    license: {status: reviewed, expression: CC-BY-4.0}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 1.45, compressed_bytes_per_token: 0.78}
    # The Nemotron-Pretraining-Specialized-v1 card documents the generators for
    # the InfiniByte-Reasoning and Scientific-Coding subsets (QwQ-32B,
    # Qwen3-235B-A22B-Thinking-2507, Qwen3-235B-A22B) and does not document any
    # verification of their outputs. verified_reasoning_v1 was therefore
    # unsatisfiable, and attesting the verification would have asserted
    # something NVIDIA does not claim.
    processing: {quality_profile: synthetic_reasoning_v1, dedup_namespace: synthetic_reasoning, priority: 88}


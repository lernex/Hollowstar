sources:
  - id: nemotron_specialized_fact_seeking
    label: Nemotron Specialized v1.2 grounded fact-seeking data
    category: synthetic
    phase_tokens: {phase_a: 5000000000, phase_b: 10000000000, phase_c: 0}
    provenance: {generated: true, transformed: true, fresh: false}
    access: {type: huggingface, repo_id: nvidia/Nemotron-Pretraining-Specialized-v1.2, revision: 807afc1fa65c441d46ebc7d9b95295a35499a527, gated: false, allow_patterns: [Nemotron-Pretraining-Fact-Seeking/**]}
    license: {status: reviewed, expression: CC-BY-4.0}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 1.25, compressed_bytes_per_token: 0.78}
    # Fact-seeking rows are short question-and-answer pairs generated from a
    # prompt, not from a grounding document, so grounded_synthetic_v1 asked two
    # things of them that are not true: a source document they never had, and a
    # 200-character floor that most correct answers fall below.
    processing: {quality_profile: synthetic_qa_v1, dedup_namespace: synthetic_grounded, priority: 96}

  - id: nemotron_v21_dqa
    label: Nemotron-CC-v2.1 high-quality document-grounded QA
    category: synthetic
    phase_tokens: {phase_a: 4000000000, phase_b: 4000000000, phase_c: 0}
    provenance: {generated: true, transformed: true, fresh: false}
    access: {type: huggingface, repo_id: nvidia/Nemotron-CC-v2.1, revision: ba6f2aaef7ada865bb08fc08640ca292150097db, gated: manual, allow_patterns: [High-Quality-DQA/**]}
    license: {status: requires_acceptance, expression: NVIDIA-Data-Agreement-for-Model-Training}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 1.20, compressed_bytes_per_token: 0.75}

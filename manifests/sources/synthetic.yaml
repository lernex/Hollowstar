      revision: 9ed3718b5f2ae29074c5e34e64115432b7c4320f
      gated: false
      allow_patterns: [Nemotron-Pretraining-Math-Textbooks/**]
    license: {status: reviewed, expression: CC-BY-4.0}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 1.50, compressed_bytes_per_token: 0.78}
    processing: {quality_profile: grounded_synthetic_v1, dedup_namespace: synthetic_grounded, priority: 94}

  - id: nemotron_rqa_verified_reasoning
    label: NVIDIA Nemotron retrieval-grounded questions, derivations, and repairs
    category: synthetic
    phase_tokens: {phase_a: 2000000000, phase_b: 7000000000, phase_c: 0}
    provenance: {generated: true, transformed: true, fresh: false}
    access:
      type: huggingface
      repo_id: nvidia/Nemotron-Pretraining-Specialized-v1
      revision: 9ed3718b5f2ae29074c5e34e64115432b7c4320f
      gated: false
      allow_patterns: [Nemotron-Pretraining-RQA/**]
    license: {status: reviewed, expression: CC-BY-4.0}
    acquisition: {driver: hf_snapshot, candidate_multiplier: 1.55, compressed_bytes_per_token: 0.78}
    # See nemotron_specialized_reasoning_scicode. The subset name says
    # "verified"; the dataset card documents no verification step. The id is
    # left alone because it is bound into dedup and holdout state, but the
    # profile now states what is actually known about these rows.
    processing: {quality_profile: synthetic_reasoning_v1, dedup_namespace: synthetic_reasoning, priority: 98}

[build-system]
requires = ["setuptools>=68,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-local"
version = "0.1.0"
description = "A small local language-model training workspace for the Metis model line."
requires-python = ">=3.11,<3.13"
dependencies = [
  "flask>=3.0",
  "torch>=2.2",
  "datasets>=2.19",
  "tokenizers>=0.15",
  "sentencepiece>=0.2",
  "tqdm>=4.66",
  "numpy>=1.26",
  "requests>=2.31",
  "huggingface_hub>=0.29",
  "transformers>=4.51",
  "safetensors>=0.4",
  "PyYAML>=6.0",
]

[project.scripts]
metis-data = "metis_data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
